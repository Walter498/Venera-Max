name: Lizi account settings and image codec native verification
on:
  push:
    branches: [verify/lizi-direct-login-23334]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lizi-image-codec-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fixed source metadata comments and matching regressions
        run: |
          npm install --prefix test/lizi_source_qa --no-save --ignore-scripts --no-audit --no-fund linkedom@0.18.12
          mkdir -p build/lizi-codec-evidence
          node test/lizi_source_qa/test.cjs > build/lizi-codec-evidence/source-regression.log
          node test/lizi_source_qa/match-regression.cjs > build/lizi-codec-evidence/match-results.json
          node test/lizi_source_qa/context-match-regression.cjs > build/lizi-codec-evidence/context-results.json
          node test/lizi_source_qa/production-entry-regression.cjs > build/lizi-codec-evidence/production-results.json
        timeout-minutes: 5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          architecture: x64
      - run: flutter pub get
        timeout-minutes: 10
      - run: bash tool/prepare_native_tests.sh
        timeout-minutes: 8
      - name: Actual native QuickJS downloader and Flutter image first frame
        run: flutter test --no-pub --concurrency=1 --timeout=120s test/lizi_account_native_test.dart test/lizi_image_codec_test.dart --reporter expanded
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lizi-native-codec-evidence
          path: build/lizi-codec-evidence/
          if-no-files-found: warn
