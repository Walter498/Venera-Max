name: Reader 253 regression 257 validation
on:
  push:
    branches: [fix/reader-settings-regression-257]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-perf-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.ref == 'refs/heads/fix/reader-settings-regression-257'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          architecture: x64
      - run: bash tool/reader_perf_ci.sh init
      - run: bash tool/reader_perf_ci.sh dependencies-ios
        timeout-minutes: 12
      - name: Build unsigned performance candidate
        run: bash tool/reader_perf_ci.sh ios
        timeout-minutes: 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-perf-candidate-device
          path: build/comments-artifacts/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-perf-candidate-evidence
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
  verify:
    if: github.ref == 'refs/heads/fix/reader-settings-regression-257'
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          architecture: x64
      - run: bash tool/reader_perf_ci.sh init
      - run: bash tool/reader_perf_ci.sh dependencies-ios
        id: deps
        timeout-minutes: 12
      - name: Strict same SDK analyzer
        run: bash tool/reader_perf_ci.sh analyze
        id: analyze
        timeout-minutes: 8
      - name: Upload early strict diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.analyze.outcome == 'failure' }}
        with:
          name: reader-perf-analyzer-early
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - run: bash tool/reader_perf_ci.sh native-tests
        id: native
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 8
      - name: Provider metadata native retention and real scrolling regression
        run: bash tool/reader_perf_ci.sh metadata
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        with:
          name: reader-perf-metadata
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - name: Indexed cache eviction and cleanup failure recovery
        run: bash tool/reader_perf_ci.sh cache
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        with:
          name: reader-perf-cache
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - name: Per-image native hook lifetime
        run: bash tool/reader_perf_ci.sh hooks
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        with:
          name: reader-perf-hooks
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - name: Per-image script engine and codec disposal
        run: bash tool/reader_perf_ci.sh script
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        with:
          name: reader-perf-script
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - name: History queue and bounded chapter feeds
        run: bash tool/reader_perf_ci.sh history
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        with:
          name: reader-perf-history
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - name: Unsubscribed image streams and terminal replay
        run: bash tool/reader_perf_ci.sh stream
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        with:
          name: reader-perf-stream
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - name: Image metadata and enhancement task lifetime
        run: bash tool/reader_perf_ci.sh lifetime
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        with:
          name: reader-perf-lifetime
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - name: Long-session index and prefetch window
        run: bash tool/reader_perf_ci.sh window
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        with:
          name: reader-perf-window
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - name: Production reader work-count and navigation regressions
        run: bash tool/reader_perf_ci.sh focused
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 8
      - name: Upload focused results before full regression
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        with:
          name: reader-perf-focused
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
      - name: Original author and upstream plus comments regression
        run: bash tool/reader_perf_ci.sh regression
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-perf-verification
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
