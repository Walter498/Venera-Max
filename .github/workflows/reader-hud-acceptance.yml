name: Reader HUD 2.x acceptance
on:
  push:
    branches: [fix/reader-hud-2x-20261120]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-hud-2x-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - run: bash tool/prepare_native_tests.sh
      - run: command -v rg || brew install ripgrep
      - run: python3 tool/prepare_hud_fonts.py
      - name: Render and compare frozen 2.x reference
        run: |
          set -o pipefail
          mkdir -p build/reader-hud-evidence
          flutter test test/reader_hud_render_test.dart --reporter expanded 2>&1 | tee build/reader-hud-evidence/pixel-tests.log
      - name: Real Reader integration acceptance
        run: |
          set -o pipefail
          flutter test test/reader_hud_integration_test.dart --reporter expanded 2>&1 | tee build/reader-hud-evidence/integration-tests.log
      - name: Existing regression suite
        run: |
          set -o pipefail
          flutter test test/global_button_contrast_test.dart test/network_favorites_parser_test.dart test/network_favorites_storage_test.dart test/reader_chrome_test.dart test/cache_scan_index_test.dart test/cached_image_loading_test.dart test/chapter_modified_times_test.dart test/comic_cache_directory_test.dart test/customization_settings_test.dart test/epub_export_test.dart test/home_comic_hero_test.dart test/llm_provider_editor_layout_test.dart test/pdf_import_test.dart test/script_translator_test.dart test/settings_menu_order_test.dart test/settings_navigation_test.dart test/settings_scope_test.dart test/settings_slider_save_test.dart test/task_list_test.dart test/tasks_page_test.dart test/filter_group_capability_test.dart test/lizi_api_client_test.dart test/reader_customizations_test.dart test/translation_performance_config_test.dart test/image_translation_rate_limiter_test.dart test/translation_config_per_comic_test.dart test/translation_store_schema_test.dart test/avif_fallback_test.dart test/avif_frame_decode_guard_test.dart test/collection_download_test.dart test/webdav_saf_upload_test.dart test/add_to_collection_test.dart 2>&1 | tee build/reader-hud-evidence/regression.log
      - name: Build unsigned iOS candidate after acceptance
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
          CARGO_BUILD_JOBS: '1'
          CARGO_NET_RETRY: '10'
        run: |
          set -o pipefail
          python3 -c "from pathlib import Path; p=Path('ios/Runner.xcodeproj/project.pbxproj'); p.write_text(p.read_text().replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"\"; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO;'))"
          flutter build ios --release --no-codesign 2>&1 | tee build/reader-hud-evidence/ios-build.log
          mkdir -p build/reader-hud-package/Payload
          cp -R build/ios/iphoneos/Runner.app build/reader-hud-package/Payload/
          cd build/reader-hud-package
          zip -qry VeneraX-reader-hud-2x.ipa Payload
          shasum -a 256 VeneraX-reader-hud-2x.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-hud-evidence
          path: build/reader-hud-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: reader-hud-candidate
          path: |
            build/reader-hud-package/*.ipa
            build/reader-hud-package/SHA256.txt
