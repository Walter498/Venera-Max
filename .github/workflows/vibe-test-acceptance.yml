name: Venera Vibe Test acceptance
on:
  push:
    branches: [test/vibe-polish-20261121]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vibe-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - name: Parse changed Dart sources before running suites
        run: dart format --output=none lib/components/{button,ios_design,loading,message,flyout,pop_up_widget,side_bar}.dart lib/pages/{home_page,home_source_feed}.dart lib/pages/favorites/{shelf_page,folder_widgets,favorites_page}.dart lib/pages/comic_details_page/comic_page.dart test/vibe*_test.dart
      - run: bash tool/prepare_native_tests.sh
      - run: command -v rg || brew install ripgrep
      - run: python3 tool/prepare_hud_fonts.py
      - name: UI interaction, actual raster and stable regression gates
        run: python3 tool/vibe_ci.py
      - name: Build unsigned overwrite-install test package
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
          CARGO_BUILD_JOBS: '1'
          CARGO_NET_RETRY: '10'
        run: |
          set -o pipefail
          python3 tool/vibe_package.py prepare
          flutter build ios --release --no-codesign --build-name=3.0.0 --build-number=3003 2>&1 | tee build/vibe-evidence/ios-build.log
          python3 tool/vibe_package.py package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibe-test-evidence
          retention-days: 14
          path: |
            build/vibe-evidence/
            build/reader-hud-evidence/
            test/failures/
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-test-ipa
          retention-days: 14
          path: |
            build/vibe-package/*.ipa
            build/vibe-package/*.json
            build/vibe-package/SHA256.txt
