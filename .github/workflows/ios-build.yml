name: venerax-ios
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  Build_IOS:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - name: Build
        run: (flutter build ios --release --no-codesign) 2>&1 | tee ios_build.log
      - name: Package IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos/
          zip -qry VeneraX-ios.ipa Payload
          ls -lh VeneraX-ios.ipa
      - name: Rename with version
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv build/ios/iphoneos/VeneraX-ios.ipa result/VeneraX-ios-$APP_VERSION.ipa
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VeneraX iOS build ${{ github.run_number }}
          files: result/*.ipa
      - name: Commit build log
        if: always()
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'github-actions'
          git add -A
          git commit -m 'ios build log [skip ci]' || echo 'no changes'
          git pull --rebase origin main || true
          git push || true
