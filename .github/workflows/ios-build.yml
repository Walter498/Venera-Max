name: venerax-ios
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  Build_IOS:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app || true
      - run: flutter pub get
      - name: Disable code signing in Xcode project
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO;/g' Runner.xcodeproj/project.pbxproj
      - name: Build
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: flutter build ios --release --no-codesign -v 2>&1 | tee ios_build.log
      - name: Package IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos/
          zip -qry VeneraX-ios.ipa Payload
          ls -lh VeneraX-ios.ipa
      - name: Rename with version
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          # 清空 result，避免把舊版 ipa 一起發佈（每次只出當前版本）
          rm -rf result
          mkdir -p result
          mv build/ios/iphoneos/VeneraX-ios.ipa result/VeneraX-ios-$APP_VERSION.ipa
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: log-${{ github.run_number }}
          name: build log ${{ github.run_number }}
          files: ios_build.log
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: VeneraX iOS build ${{ github.run_number }}
          # 只發佈本次構建的 ipa（result 已在打包前清空）
          files: result/VeneraX-ios-*.ipa
      - name: Commit build log
        if: always()
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'github-actions'
          # 只提交構建日誌，絕不提交 ipa/中間產物
          #（ios_build.log 被 .gitignore 忽略，用 -f 強制加入；
          #  整段都不允許失敗，構建成功才是重點）
          git add -f ios_build.log || true
          git reset -- result build 2>/dev/null || true
          git commit -m 'ios build log [skip ci]' || echo 'no changes'
          git pull --rebase origin main || true
          git push || true
