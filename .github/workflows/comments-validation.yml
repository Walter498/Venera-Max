name: Comments UI validation
on:
  push:
    branches: [feat/lizi-qingman-provider-20261015]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comments-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  candidate_ipa:
    name: Build candidate IPA independently of test gates
    if: github.ref == 'refs/heads/feat/lizi-qingman-provider-20261015'
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize candidate provenance
        run: bash tool/comments_ci_run.sh init
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          architecture: x64
      - name: Pinned SDK and locked candidate dependencies
        timeout-minutes: 12
        run: bash tool/comments_ci_run.sh dependencies-ios
      - name: Compile unsigned candidate device IPA and validate package
        timeout-minutes: 25
        run: bash tool/comments_ci_run.sh ios
      - name: Label candidate package without claiming acceptance
        run: |
          python3 -c 'import json,os,pathlib; p=pathlib.Path("build/comments-artifacts/candidate-status.json"); p.write_text(json.dumps({"commit":os.environ["GITHUB_SHA"],"kind":"unsigned candidate device IPA","release_accepted":False,"full_test_acceptance_pending":True},indent=2))'
      - name: Upload candidate IPA - full test acceptance pending
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comments-ios-candidate-device
          path: build/comments-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidate compiler errors and package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comments-ios-candidate-evidence
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
          retention-days: 14
  ios:
    if: github.ref == 'refs/heads/feat/lizi-qingman-provider-20261015' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize provenance and evidence
        id: evidence
        run: bash tool/comments_ci_run.sh init
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          architecture: x64
      - name: Pinned SDK and locked dependencies
        id: dependencies
        timeout-minutes: 12
        run: bash tool/comments_ci_run.sh dependencies-ios
      - name: Strict same-SDK baseline analyzer gate
        id: analyze
        timeout-minutes: 8
        run: bash tool/comments_ci_run.sh analyze
      - name: Upload early analyzer diagnostics without waiting for tests
        if: ${{ !cancelled() && steps.analyze.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: comments-ios-analyzer-early
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare original QuickJS and PDFium host libraries
        id: native
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 8
        run: bash tool/comments_ci_run.sh native-tests
      - name: Real Qingman capability getter and settings bridge probe
        id: capability
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 3
        run: python3 tool/comments_capability_probe.py capability
      - name: Complete shipped source capability and provider probe
        id: shipped
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 3
        run: python3 tool/comments_capability_probe.py shipped
      - name: Provider recovery and verified native search parameters
        id: recovery
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 tool/comments_capability_probe.py recovery
      - name: Upload focused capability result before full regression
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: comments-ios-capability-probe
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Original author 13 and 28-file regression plus new comments tests
        id: tests
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 20
        run: bash tool/comments_ci_run.sh tests
      - name: Real Flutter widget golden comparison and fresh PNG capture
        id: render
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 12
        run: bash tool/comments_ci_run.sh render
      - name: Build unsigned iPhoneOS Release and validate IPA
        id: ios
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.capability.outcome == 'success' && steps.shipped.outcome == 'success' && steps.recovery.outcome == 'success' && steps.tests.outcome == 'success' && steps.render.outcome == 'success' }}
        timeout-minutes: 20
        run: bash tool/comments_ci_run.sh ios
      - name: Record every gate outcome
        if: always()
        env:
          COMMENTS_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: bash tool/comments_ci_run.sh outcomes
      - name: Upload raw logs, exits, golden PNG and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comments-ios-evidence
          path: ${{ runner.temp }}/venera-comments-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload package and checksum even on downstream failure
        if: ${{ always() && steps.ios.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: comments-ios-unsigned-device
          path: build/comments-artifacts/
          if-no-files-found: error
          retention-days: 14
